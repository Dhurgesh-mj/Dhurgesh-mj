<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
<defs><filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter></defs>
<style>.e{font:400 54px Georgia,'Times New Roman',serif;fill:#f1ede4;letter-spacing:22px;text-anchor:middle;animation:f 8s ease-in-out infinite}
@keyframes f{0%{opacity:0}30%,75%{opacity:1}100%{opacity:0}}
.s{font:italic 14px Georgia,'Times New Roman',serif;fill:#8a8f9c;text-anchor:middle}</style>
<rect width="900" height="240" fill="#07080c"/>
<circle cx="450" cy="110" r="90" fill="#f5b971" opacity=".22" filter="url(#b)"><animate attributeName="opacity" values=".1;.3;.1" dur="8s" repeatCount="indefinite"/></circle>
<text class="e" x="461" y="120">THE END</text>
<text class="s" x="450" y="175">No sequels planned. (There will be sequels.)</text>
</svg>